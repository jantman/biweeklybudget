name: Claude Code

# Reactive: does nothing until someone writes @claude. Pairs with
# claude-pr-review.yml, which reviews every PR unprompted.
#
# >>> DO NOT MERGE THESE TWO INTO ONE JOB. <<<
# They look redundant and are not. Supplying a `prompt` puts the action in AGENT
# mode for every event it sees, so a single job carrying both triggers would
# answer @claude comments in agent mode: no PR context, no tracking comment, and
# nothing posted back. This file deliberately supplies no prompt, which is what
# keeps it in TAG mode. Deleting one as a duplicate of the other has silently
# broken @claude before.
#
# NOTE: `issue_comment` workflows always run from the default branch, so edits to
# this file do nothing until they are on `master`.
#
# The 👀 reaction on an @claude comment comes from the GitHub App acknowledging the
# mention. It is NOT evidence that anything ran -- the work happens here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two conditions, both required, and they must be checked per-event.
    #
    # 1. author_association of the person who ACTUALLY TRIGGERED IT. This repository is
    #    public and this job has `contents: write` and blanket `Bash`, so without this
    #    check any passer-by who types @claude gets an arbitrary-code-execution agent
    #    run on the maintainer's OAuth token. The pairing matters: on `issue_comment`,
    #    `github.event.issue.author_association` is the issue's *opener*, not the
    #    commenter, so checking that field here would let a stranger trigger a run
    #    merely by commenting on a maintainer's own issue. OWNER covers the repository
    #    owner; COLLABORATOR/MEMBER cover anyone later given push access.
    # 2. the @claude mention itself.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs.
          # It is also what makes the three `mcp__github_ci__*` tools available; tag
          # mode adds them to the allowlist on its own, so they are not listed below.
          additional_permissions: |
            actions: read

          # No `prompt:` on purpose -- see the header. That is what keeps this in tag
          # mode, where Claude performs the instructions in the comment that tagged it.

          # Without these the log shows only "init" and "result". On a public
          # repository the job log and the artifacts below are world-readable, so this
          # is a deliberate trade: without them, a run that was starved by a denied
          # tool call is indistinguishable from one that had nothing to do.
          display_report: true
          show_full_output: true

          # >>> Do not go back to an enumerated command allowlist. <<<
          # Earlier versions of this file listed individual Bash commands (puppet-lint,
          # rake spec, ./bin/run_tests.sh, nox, poetry, ...). Anything unlisted is a
          # SILENT denial: the run goes green having done nothing, which is exactly how
          # the PR-review job failed before it was rebuilt. Skill and Task matter for
          # the same reason -- a skill or a subagent that cannot be invoked is not an
          # error, just an absence.
          #
          # Unlike the review job, this one can push, so it is the more powerful of the
          # two. What keeps blanket Bash acceptable is who can reach it at all -- see
          # the `if:` above and the comment on it.
          #
          # In tag mode this list is MERGED with the action's own base tools (Read/Glob/
          # Grep/LS, the comment-update tool, the CI tools, and git add/commit/push/rm);
          # it does not replace them. Naming an `mcp__github_*` tool here is also what
          # installs the corresponding MCP server, which is why the inline-comment tool
          # is listed even though this job rarely reaches for it.
          #
          # WebSearch and WebFetch are DISALLOWED by default in tag mode; naming them
          # here is what lifts that. They are worth having -- "@claude why does this
          # library do X" is most of what the mention job gets asked -- and the `if:`
          # above is what makes it an acceptable trade, since an agent that can fetch
          # arbitrary URLs and also push is only reachable by someone with push access.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Edit,Write,Task,Skill,TodoWrite,WebSearch,WebFetch,Bash"

      # The action discards its transcript with the runner. Without this there is no way
      # to explain a green run that did nothing.
      - name: Collect Claude logs
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/claude-logs"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cp "$EXECUTION_FILE" "$RUNNER_TEMP/claude-logs/execution-output.json"
          fi
          if [ -d "$HOME/.claude/projects" ]; then
            cp -r "$HOME/.claude/projects" "$RUNNER_TEMP/claude-logs/sessions"
          fi
          find "$RUNNER_TEMP/claude-logs" -type f -printf '%s\t%p\n' | sort -rn

      - name: Upload Claude logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-mention-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-logs/
          if-no-files-found: warn
          retention-days: 14

      # Same guard as claude-pr-review.yml: a denied tool call is how one of these
      # jobs passes while having done nothing. There is no comment to annotate here
      # -- in tag mode the action maintains its own tracking comment -- so the
      # numbers go to the job summary and a denial fails the check.
      - name: Summarise the run and fail on permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::warning title=Claude did not run::No execution file was produced, so the agent never started. Expected if this PR edits .github/workflows/claude-*.yml (workflow validation skip)."
            exit 0
          fi

          RESULT=$(jq -c '[.[] | select(.type == "result")] | last // empty' "$EXECUTION_FILE")
          if [ -z "$RESULT" ]; then
            echo "::warning title=No result block::The execution file exists but contains no result object."
            exit 0
          fi

          DURATION_MS=$(jq -r '.duration_ms // 0' <<<"$RESULT")
          TURNS=$(jq -r '.num_turns // 0' <<<"$RESULT")
          COST=$(jq -r '.total_cost_usd // 0' <<<"$RESULT")
          DENIALS=$(jq -r '.permission_denials_count // 0' <<<"$RESULT")
          IS_ERROR=$(jq -r '.is_error // false' <<<"$RESULT")

          HUMAN=$(awk -v ms="$DURATION_MS" 'BEGIN {
            s = int(ms / 1000)
            if (s < 60) { printf "%ds", s } else { printf "%dm %ds", int(s / 60), s % 60 }
          }')
          COST_FMT=$(awk -v c="$COST" 'BEGIN { printf "%.4f", c }')

          {
            echo "### Claude (@mention)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Duration | $HUMAN |"
            echo "| Turns | $TURNS |"
            echo "| Cost | \$$COST_FMT |"
            echo "| Permission denials | $DENIALS |"
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS=0
          if [ "$DENIALS" != "0" ]; then
            echo "::error title=Claude was denied $DENIALS tool call(s)::A denied tool means the run was starved, even though it exited cleanly. Add the missing tool to --allowedTools. See the claude-mention-logs-* artifact."
            STATUS=1
          fi
          if [ "$IS_ERROR" = "true" ]; then
            echo "::error title=Claude reported an error::The run's result block has is_error=true."
            STATUS=1
          fi
          exit $STATUS
